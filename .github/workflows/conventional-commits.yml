name: Conventional commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  title:
    runs-on: ubuntu-latest
    name: PR title
    steps:
      - uses: actions/checkout@v4

      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          allowed='feat|fix|docs|chore|refactor|test|ci|build|perf|style|revert'
          if ! printf '%s\n' "$TITLE" | grep -Eq "^(${allowed})(\([a-z0-9][a-z0-9._/-]*\))?!?: .+"; then
            echo "PR title must be a Conventional Commit subject."
            echo "Got: $TITLE"
            exit 1
          fi

          issue=$(printf '%s\n' "$BRANCH" | sed -nE "s#^(${allowed})/([0-9]+)(-.+)?\$#\2#p")
          if [ -n "$issue" ]; then
            if ! printf '%s\n' "$TITLE" | grep -Eq "#${issue}\\b"; then
              echo "PR title must reference #${issue} from branch ${BRANCH}."
              echo "Got: $TITLE"
              exit 1
            fi
          fi
