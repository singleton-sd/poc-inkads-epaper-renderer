name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

# Git push, tag, and GitHub Release use the singleton-release GitHub App
# (on the main ruleset bypass list). Default GITHUB_TOKEN is only for npm
# Trusted Publishing (OIDC). Never a PAT, never fall back to GITHUB_TOKEN
# for the push — that hits GH013.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):') }}"
    runs-on: ubuntu-latest
    name: release-it
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Require singleton-release GitHub App credentials
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          if [[ -z "${RELEASE_APP_ID}" ]]; then
            missing+=('vars.RELEASE_APP_ID')
          fi
          if [[ -z "${RELEASE_APP_PRIVATE_KEY}" ]]; then
            missing+=('secrets.RELEASE_APP_PRIVATE_KEY')
          fi
          if ((${#missing[@]} > 0)); then
            echo "Refusing to release: missing ${missing[*]}." >&2
            echo "Install the singleton-release GitHub App, set those values, and add the app to the main branch ruleset bypass list." >&2
            echo "Do not fall back to GITHUB_TOKEN: it cannot push to main under the CodeRabbit required ruleset (GH013)." >&2
            exit 1
          fi

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: singleton-sd

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # Keep the write token out of git config until the Release step.
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          # Do not set registry-url here. Trusted Publishing uses OIDC; setup-node
          # would write ~/.npmrc with always-auth and an empty _authToken, which
          # npm ≥11.5 rejects as Unknown user config / a bogus --//registry flag.

      - name: Install
        run: pnpm install --frozen-lockfile

      # Trusted Publishing needs npm ≥ 11.5.1. Pin exactly: npm@latest currently
      # pulls 12.x, and release-it + publishConfig.registry previously produced
      # a single argv token that npm 12 rejected as --//registry.npmjs.org.
      - name: Upgrade npm for OIDC publish
        run: |
          set -euo pipefail
          npm install -g npm@11.5.1
          npm --version
          # Fail closed if a leftover auth rc would short-circuit OIDC.
          # Do not print the file: it may contain credentials.
          if [[ -f "$HOME/.npmrc" ]] && grep -qE 'always-auth|^//registry\.npmjs\.org' "$HOME/.npmrc"; then
            echo "Refusing to publish with an auth .npmrc that Trusted Publishing does not need: $HOME/.npmrc" >&2
            exit 1
          fi

      - name: Get GitHub App user ID
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          user_id="$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)"
          echo "user-id=${user_id}" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.user-id }}
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          GIT_AUTHOR_EMAIL: ${{ format('{0}+{1}[bot]@users.noreply.github.com', steps.app-user.outputs.user-id, steps.app-token.outputs.app-slug) }}
          GIT_COMMITTER_NAME: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          GIT_COMMITTER_EMAIL: ${{ format('{0}+{1}[bot]@users.noreply.github.com', steps.app-user.outputs.user-id, steps.app-token.outputs.app-slug) }}
        run: |
          set -euo pipefail

          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin main --tags
          git checkout -B main origin/main

          # Do not retry failed runs: commit/tag/push may already have
          # succeeded while GitHub release creation failed, and retrying
          # would cut another empty version bump.
          pnpm release:ci
