name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

# Least privilege: tags + GitHub Releases (contents) and npm Trusted
# Publishing (id-token). No PAT, no ruleset bypass. GITHUB_TOKEN cannot
# push to main under the CodeRabbit required ruleset (GH013); this
# workflow never tries.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: release-it
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Keep the write token out of git config until the Release step.
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          # Do not set registry-url here. Trusted Publishing uses OIDC; setup-node
          # would write ~/.npmrc with always-auth and an empty _authToken, which
          # npm ≥11.5 rejects as Unknown user config / a bogus --//registry flag.

      - name: Install
        run: pnpm install --frozen-lockfile

      # Trusted Publishing needs npm ≥ 11.5.1. Pin exactly: npm@latest currently
      # pulls 12.x, and release-it + publishConfig.registry previously produced
      # a single argv token that npm 12 rejected as --//registry.npmjs.org.
      - name: Upgrade npm for OIDC publish
        run: |
          set -euo pipefail
          npm install -g npm@11.5.1
          npm --version
          # Fail closed if a leftover auth rc would short-circuit OIDC.
          # Do not print the file: it may contain credentials.
          if [[ -f "$HOME/.npmrc" ]] && grep -qE 'always-auth|^//registry\.npmjs\.org' "$HOME/.npmrc"; then
            echo "Refusing to publish with an auth .npmrc that Trusted Publishing does not need: $HOME/.npmrc" >&2
            exit 1
          fi

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin main --tags
          git checkout -B main origin/main

          # Tag-only: release-it must not git push HEAD/main (branch
          # rulesets such as "CodeRabbit required" reject that with
          # GH013, and GITHUB_TOKEN cannot bypass them). The
          # before:github:release hook pushes refs/tags/<X.Y.Z> only
          # (after:git:release is skipped when git.push is false).
          # Do not retry a run that already created the tag: requireCommits
          # then exits 0, and the GitHub Release would be missing.
          pnpm release:ci
